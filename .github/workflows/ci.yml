name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.11.33
      - run: uv sync --locked --extra dev --python '${{ matrix.python-version }}'
      - run: uv run --locked --extra dev ruff check .
      - run: uv run --locked --extra dev ruff format --check .
      - name: Check generated documentation diagrams
        run: uv run --locked --extra dev python scripts/render_diagrams.py --check
      - run: uv run --locked --extra dev mypy
      - name: Audit published paired evaluation
        run: uv run --locked --extra dev python scripts/audit_comparison.py
      - name: Audit optimization experiments
        run: |
          for results in benchmarks/results/ragtruth-optimized-dev-30 benchmarks/results/ragtruth-quoted-dev-30 benchmarks/results/ragtruth-json-dev-30 benchmarks/results/ragtruth-plus-judge-dev-30 benchmarks/results/ragtruth-optimized-eval-60; do
            uv run --locked --extra dev python scripts/audit_comparison.py --results "$results"
          done
      - run: uv run --locked --extra dev pytest --cov=verifigen --cov-fail-under=85
      - name: Rebuild annotated fixtures
        run: |
          uv run --locked --extra dev python scripts/build_fixtures.py
          git diff --exit-code -- benchmarks/data
          uv run --locked --extra dev python scripts/build_rag_eval.py
          git diff --exit-code -- examples/rag_qa/eval_cases.jsonl
          uv run --locked --extra dev python scripts/build_multiscenario_eval.py
          git diff --exit-code -- examples/customer_support/eval_cases.jsonl examples/data_to_text/eval_cases.jsonl
          uv run --locked --extra dev python scripts/build_web_data.py
          git diff --exit-code -- src/verifigen/web/data
      - run: uv run --locked --extra dev verifigen demo
      - run: uv run --locked --extra dev python -m build

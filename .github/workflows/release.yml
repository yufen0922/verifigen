name: Draft release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.33
      - run: uv sync --locked --extra dev
      - name: Check version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --locked --extra dev python -c "import os, verifigen; assert os.environ['RELEASE_TAG'] == 'v' + verifigen.__version__"
      - run: uv run --locked --extra dev ruff check .
      - run: uv run --locked --extra dev mypy
      - run: uv run --locked --extra dev pytest --cov=verifigen --cov-fail-under=85
      - run: uv run --locked --extra dev python -m build
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file CHANGELOG.md dist/*

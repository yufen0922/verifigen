[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verifigen"
version = "0.2.0"
description = "Context-aware LLM judge and repair loops for generated content"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "yufen0922"}]
maintainers = [{name = "yufen0922"}]
keywords = ["llm", "agent", "verification", "repair", "grounding"]
dependencies = ["pydantic>=2.9,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
llm = ["httpx>=0.27,<1"]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=6,<8", "ruff>=0.9,<1", "mypy>=1.14,<2", "build>=1.2,<2"]

[project.scripts]
verifigen = "verifigen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verifigen = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/verifigen"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[project.urls]
Homepage = "https://github.com/yufen0922/verifigen"
Repository = "https://github.com/yufen0922/verifigen"
Issues = "https://github.com/yufen0922/verifigen/issues"
